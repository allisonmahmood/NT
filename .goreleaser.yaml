# Linux release archives. macOS restoration is tracked in issue #23.
# The first Go release is v0.1.0. CI uses a local v0.1.0-snapshot tag to
# exercise changelog generation and packaging without publishing.
version: 2

project_name: nt

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: nt
    main: .
    binary: nt
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: nt
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# One SPDX JSON SBOM per archive (nt_<ver>_<os>_<arch>.tar.gz.sbom.json).
# Requires syft on PATH; CI installs it via anchore/sbom-action/download-syft.
sboms:
  - artifacts: archive

# Actions prepares a verified draft; scripts/publish-release.sh checks live
# immutability with the maintainer login before publishing.
release:
  draft: true

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

name: release

# Authored now; fires only when a v* tag is pushed (plan §5 — releases come
# later, once tested on real machines).
on:
  push:
    tags:
      - "v*"

# Least privilege: the workflow itself gets nothing; the release job gets only
# what publishing + attesting needs.
permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release and upload assets
      id-token: write      # OIDC token for Sigstore-backed build provenance
      attestations: write  # store attestations on the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_PAT pushes the Homebrew tap once the tap repo + secret exist.
          # GH_PAT: ${{ secrets.GH_PAT }}
      # Build provenance (SLSA) for every archive, SBOM, and the checksum
      # manifest, tying each asset to this workflow run and source revision.
      # Verify with: gh attestation verify <file> --repo allisonmahmood/NT
      # No cosign/GPG keys are involved; the signature is Sigstore keyless via
      # the workflow's OIDC identity.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sbom.json
            dist/checksums.txt

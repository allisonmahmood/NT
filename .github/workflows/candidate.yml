name: release candidate

on:
  workflow_call:
    inputs:
      attest:
        type: boolean
        default: false

# Permissions come from the caller: PR builds have contents:read only.
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: Create local snapshot tag
        run: git tag --force v0.1.0-snapshot
      - name: Build release candidate (no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          args: release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: v0.1.0-snapshot
      - name: Verify release candidate artifacts
        run: test/release-candidate.sh
      # Rehearse provenance without publishing anything: attest the snapshot
      # artifacts and verify every subject, exactly as release.yml will.
      - name: Attest release candidate artifacts
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sbom.json
            dist/checksums.txt
      - name: Verify release candidate attestations
        if: inputs.attest
        run: test/verify-attestations.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_PATH: .github/workflows/candidate.yml

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
      - name: gofmt
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then echo "needs gofmt:"; echo "$fmt"; exit 1; fi
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.27.0", "1.26.7"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -coverprofile=coverage.out ./...

  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
      - name: Install supported shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Run the zsh parity oracle against the Go binary
        run: zsh test/parity/run.zsh
      - name: Verify bash, zsh, and fish integration
        run: test/shell-integration.sh

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      PKGVER: "0.1.0"
    steps:
      - name: Install Arch packaging tools
        run: pacman --sync --refresh --sysupgrade --noconfirm git go namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare a temporary package recipe for current source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Exercise HEAD without modifying the release recipe or its pinned checksum.
          mkdir -p "$RUNNER_TEMP/nt-package"
          cp packaging/arch/nt/PKGBUILD "$RUNNER_TEMP/nt-package/PKGBUILD"
          git archive --format=tar.gz --prefix="NT-${PKGVER}/" \
            --output="$RUNNER_TEMP/nt-package/nt-${PKGVER}.tar.gz" HEAD
          source_hash="$(sha256sum "$RUNNER_TEMP/nt-package/nt-${PKGVER}.tar.gz" | cut -d ' ' -f 1)"
          sed -i "s/^sha256sums=.*/sha256sums=('$source_hash')/" "$RUNNER_TEMP/nt-package/PKGBUILD"
          useradd --create-home builder
          chown --recursive builder:builder "$RUNNER_TEMP/nt-package"
      - name: Build and inspect the source package
        run: |
          su --login builder --command "cd '$RUNNER_TEMP/nt-package' && makepkg --noconfirm --cleanbuild"
          package="$RUNNER_TEMP/nt-package/nt-${PKGVER}-1-x86_64.pkg.tar.zst"
          namcap "$RUNNER_TEMP/nt-package/PKGBUILD" "$package"
          mkdir package-root
          bsdtar -xf "$package" -C package-root
          test "$(package-root/usr/bin/nt --version)" = "nt version ${PKGVER}"

  build-snapshot:
    uses: ./.github/workflows/candidate.yml
    permissions:
      contents: read

  attest-snapshot:
    if: github.event_name == 'push'
    uses: ./.github/workflows/candidate.yml
    with:
      attest: true
    permissions:
      contents: read
      id-token: write
      attestations: write
